name: Fork Status Notifier

on:
  schedule:
    - cron: '42 23 * * *'
  workflow_dispatch:

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run check script
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
        WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
        # 1. 不在微信中输出状态的仓库名单（逗号分隔）
        EXCLUDE_STATUS_REPOS: 'CloudPaste,excalidraw,logseq-publish,NotionNext,SULLYTEST2-fork,geminicli2api,fork-omnivore'
        # 2. 不自动同步的仓库名单（逗号分隔）
        EXCLUDE_SYNC_REPOS: 'fork-SullyOS,CloudPaste,excalidraw,logseq-publish,NotionNext,SULLYTEST2-fork,geminicli2api,fork-omnivore'
      run: python check_forks.py
